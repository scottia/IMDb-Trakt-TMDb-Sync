name: implement public IMDb ratings source

on:
  push:
    branches:
      - feat/public-imdb-ratings-source
    paths:
      - .github/workflows/implement-public-imdb-ratings.yaml
      - scripts/implement_public_ratings.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/public-imdb-ratings-source
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.13
          cache-dependency-path: go.sum

      - name: Apply implementation
        run: python3 scripts/implement_public_ratings.py

      - name: Format and test
        run: |
          gofmt -w internal/config/config.go internal/config/config_imdb_ratings_test.go internal/imdb/public_ratings.go internal/imdb/public_ratings_test.go internal/imdb/waf.go internal/syncer/syncer.go
          go test ./...
          make build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-public-imdb-ratings.yaml scripts/implement_public_ratings.py
          git add README.md examples/private-runner/sync.yaml internal/config internal/imdb internal/syncer/syncer.go
          git commit -m "feat(imdb): use public ratings source when browser WAF blocks"
          git push origin HEAD:feat/public-imdb-ratings-source
