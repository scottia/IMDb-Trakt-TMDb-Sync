name: security dependency remediation

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/security-dependency-remediation.yaml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@v5
        with:
          ref: dev

      - name: Setup patched Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.13

      - name: Apply security floors
        run: |
          set -euxo pipefail
          go mod edit -go=1.25.13
          go get golang.org/x/crypto@v0.52.0 \
                 golang.org/x/net@v0.55.0 \
                 golang.org/x/text@v0.39.0 \
                 github.com/quic-go/quic-go@v0.59.1 \
                 github.com/cloudflare/circl@v1.6.3
          go mod tidy
          sed -i 's/1\.25\.1/1.25.13/g' Dockerfile .github/workflows/quality.yaml .github/workflows/release.yaml examples/private-runner/sync.yaml
          git diff -- Dockerfile go.mod go.sum .github/workflows/quality.yaml .github/workflows/release.yaml examples/private-runner/sync.yaml

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
          skip-cache: true

      - name: Vulnerability reachability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Commit validated security update
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile go.mod go.sum .github/workflows/quality.yaml .github/workflows/release.yaml examples/private-runner/sync.yaml
          if git diff --cached --quiet; then
            echo 'No security changes required.'
            exit 0
          fi
          git commit -m 'security: patch Go toolchain and transitive dependencies'
          git push origin HEAD:dev
