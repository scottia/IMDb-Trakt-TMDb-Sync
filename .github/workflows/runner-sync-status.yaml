name: runner sync

on:
  repository_dispatch:
    types:
      - runner_sync_status

permissions:
  contents: read

jobs:
  status:
    name: private runner
    runs-on: ubuntu-24.04

    steps:
      - name: Validate private Runner status
        env:
          RUNNER_STATUS: ${{ github.event.client_payload.status }}
        run: |
          echo "Private Runner sync status: $RUNNER_STATUS"

          case "$RUNNER_STATUS" in
            success)
              exit 0
              ;;
            failure|cancelled)
              exit 1
              ;;
            *)
              echo "Unexpected Runner status: $RUNNER_STATUS"
              exit 1
              ;;
          esac
