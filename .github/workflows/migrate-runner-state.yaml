name: migrate-private-runner-state

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-runner-state.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-state:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sync state
        uses: actions/checkout@v5
        with:
          ref: sync-state
          path: source-state
          sparse-checkout: state

      - name: Check out private runner
        uses: actions/checkout@v5
        with:
          repository: scottia/IMDb-Trakt-TMDb-Sync-Runner
          ref: main
          path: runner
          token: ${{ secrets.GH_PAT }}

      - name: Copy state
        run: |
          set -euo pipefail
          rm -rf runner/state
          cp -a source-state/state runner/state
          cd runner
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "private runner state already current"
            exit 0
          fi
          git commit -m "chore(state): migrate private sync state"
          git push origin HEAD:main
