name: dev repository cleanup

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/dev-repo-cleanup.yaml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.1

      - name: Rewrite repository identity and remove dead files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          old = "github.com/cecobask/imdb-trakt-sync"
          new = "github.com/scottia/IMDb-Trakt-TMDb-Sync"

          targets = [Path("go.mod"), Path(".golangci.yaml")]
          targets.extend(Path(".").rglob("*.go"))

          changed = []
          for path in targets:
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  changed.append(str(path))

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old_note = "> Trakt API app creation currently requires Trakt VIP access. See upstream issue [#107](https://github.com/cecobask/imdb-trakt-sync/issues/107)."
          new_note = "> Trakt API app creation currently requires Trakt VIP access. Manage API applications from [Trakt API Apps](https://app.trakt.tv/settings/apps)."
          if old_note not in text:
              raise SystemExit("expected upstream Trakt issue note was not found")
          readme.write_text(text.replace(old_note, new_note), encoding="utf-8")

          print("Rewritten project-identity files:")
          for path in changed:
              print(f"  {path}")
          PY

          rm -f .env.example assets/logo.svg

          # Keep the established CLI alias for backwards compatibility, but
          # update the user-facing command description to the current project name.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("cmd/root/root.go")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'Short:   "imdb-trakt-sync command line interface",',
              'Short:   "IMDb-Trakt-TMDb-Sync command line interface",',
          )
          path.write_text(text, encoding="utf-8")
          PY

          gofmt -w $(git ls-files '*.go')
          go mod tidy

          test "$(head -n 1 go.mod)" = "module github.com/scottia/IMDb-Trakt-TMDb-Sync"
          grep -q 'github.com/cecobask/awswaf' go.mod

          if git grep -n 'github.com/cecobask/imdb-trakt-sync' -- . ':!LICENSE' ':!.github/workflows/dev-repo-cleanup.yaml'; then
            echo "ERROR: stale upstream project module path remains"
            exit 1
          fi

          # Original MIT copyright attribution must remain unchanged.
          git diff --exit-code -- LICENSE
          grep -q 'Copyright (c) 2024 cecobask' LICENSE

          git diff --check

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
          skip-cache: true

      - name: Commit cleanup to dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No cleanup changes to commit"
            exit 0
          fi

          git commit -m "chore: adopt public repository identity and prune dead files"
          git push origin HEAD:dev
