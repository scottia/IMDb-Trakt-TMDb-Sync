name: sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync.yaml
      - config.yaml
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-sync
  cancel-in-progress: false

env:
  ITS_IMDB_COOKIEATMAIN: ${{ secrets.IMDB_COOKIEATMAIN }}
  ITS_IMDB_COOKIEJARFILE: ${{ github.workspace }}/imdb-cookie-jar.json

  ITS_TRAKT_CLIENTID: ${{ secrets.TRAKT_CLIENTID }}
  ITS_TRAKT_CLIENTSECRET: ${{ secrets.TRAKT_CLIENTSECRET }}
  ITS_TRAKT_TOKENFILE: ${{ github.workspace }}/trakt-token.json

  ITS_TMDB_READACCESSTOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
  ITS_TMDB_SESSIONID: ${{ secrets.TMDB_SESSION_ID }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out private runner state
        uses: actions/checkout@v5
        with:
          path: runner

      - name: Check out application source
        uses: actions/checkout@v5
        with:
          repository: scottia/IMDb-Trakt-TMDb-Sync
          ref: main
          path: app
          persist-credentials: false

      - name: Install Google Chrome
        run: |
          wget -q https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/1321438/chrome-linux.zip
          unzip -q chrome-linux.zip
          if test -f "$GITHUB_WORKSPACE/chrome-linux/chrome"; then
            echo "Google Chrome binary stored at $GITHUB_WORKSPACE/chrome-linux/chrome"
          else
            echo "Google Chrome binary not found"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.13
          cache-dependency-path: app/go.sum

      - name: Build
        working-directory: app
        run: make build

      - name: Seed IMDb cookie jar
        env:
          IMDB_COOKIE_JAR: ${{ secrets.IMDB_COOKIE_JAR }}
        run: |
          if [ -n "$IMDB_COOKIE_JAR" ]; then
            printf '%s' "$IMDB_COOKIE_JAR" > "$ITS_IMDB_COOKIEJARFILE"
            cp "$ITS_IMDB_COOKIEJARFILE" "$RUNNER_TEMP/imdb-cookie-jar.before.json"
          else
            echo "no IMDB_COOKIE_JAR secret set; IMDb will bootstrap from IMDB_COOKIEATMAIN and create a cookie jar after successful authentication"
          fi

      - name: Seed Trakt token
        env:
          TRAKT_TOKEN: ${{ secrets.TRAKT_TOKEN }}
        run: |
          if [ -n "$TRAKT_TOKEN" ]; then
            printf '%s' "$TRAKT_TOKEN" > "$ITS_TRAKT_TOKENFILE"
          else
            echo "no TRAKT_TOKEN secret set; an enabled Trakt destination will request device authorization on first use"
          fi

      - name: Sync
        working-directory: app
        env:
          ITS_IMDB_BROWSERPATH: ${{ github.workspace }}/chrome-linux/chrome
          ITS_STATE_DIR: ${{ github.workspace }}/runner/state
          ITS_STATE_RECONCILEINTERVAL: 168h
        run: ./build/its sync --config-file ../runner/config.yaml

      - name: Persist sync state
        if: success()
        working-directory: runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "sync state unchanged"
            exit 0
          fi
          git commit -m "chore(state): advance IMDb ratings baseline [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Persist refreshed IMDb cookie jar
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f "$ITS_IMDB_COOKIEJARFILE" ]; then
            exit 0
          fi
          if [ -f "$RUNNER_TEMP/imdb-cookie-jar.before.json" ] && \
             cmp -s "$RUNNER_TEMP/imdb-cookie-jar.before.json" "$ITS_IMDB_COOKIEJARFILE"; then
            echo "IMDb cookie jar unchanged"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "no GH_PAT secret set; cannot persist the refreshed IMDb cookie jar"
            exit 1
          fi
          gh secret set IMDB_COOKIE_JAR --repo "$GITHUB_REPOSITORY" < "$ITS_IMDB_COOKIEJARFILE"

      - name: Persist rotated Trakt token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f "$ITS_TRAKT_TOKENFILE" ]; then
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "no GH_PAT secret set; cannot persist the rotated Trakt token"
            exit 1
          fi
          gh secret set TRAKT_TOKEN --repo "$GITHUB_REPOSITORY" < "$ITS_TRAKT_TOKENFILE"

  publish-status:
    name: publish runner status
    needs: sync
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.STATUS_PAT }}
      RUNNER_STATUS: ${{ needs.sync.result }}
      STATUS_REPOSITORY: scottia/IMDb-Trakt-TMDb-Sync
    steps:
      - name: Publish Runner status
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no STATUS_PAT secret set; skipping public Runner status"
            exit 0
          fi

          echo "Publishing Runner status: $RUNNER_STATUS"

          gh api \
            --method POST \
            "repos/$STATUS_REPOSITORY/dispatches" \
            -f event_type=runner_sync_status \
            -F "client_payload[status]=$RUNNER_STATUS"
