name: sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync.yaml
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-sync
  cancel-in-progress: false

env:
  ITS_IMDB_AUTH: ${{ secrets.IMDB_AUTH }}
  ITS_IMDB_EMAIL: ${{ secrets.IMDB_EMAIL }}
  ITS_IMDB_PASSWORD: ${{ secrets.IMDB_PASSWORD }}
  ITS_IMDB_COOKIEATMAIN: ${{ secrets.IMDB_COOKIEATMAIN }}
  ITS_IMDB_LISTS: ${{ secrets.IMDB_LISTS }}
  ITS_IMDB_IGNOREDLISTS: ${{ secrets.IMDB_IGNOREDLISTS }}
  ITS_IMDB_TRACE: ${{ secrets.IMDB_TRACE }}
  ITS_IMDB_HEADLESS: ${{ secrets.IMDB_HEADLESS }}
  ITS_IMDB_BROWSERPATH: ${{ github.workspace }}/chrome-linux/chrome

  ITS_TRAKT_ENABLED: ${{ secrets.TRAKT_ENABLED || 'true' }}
  ITS_TRAKT_CLIENTID: ${{ secrets.TRAKT_CLIENTID }}
  ITS_TRAKT_CLIENTSECRET: ${{ secrets.TRAKT_CLIENTSECRET }}
  ITS_TRAKT_TOKENFILE: ${{ github.workspace }}/trakt-token.json
  ITS_TRAKT_SYNC_MODE: ${{ secrets.TRAKT_SYNC_MODE || 'dry-run' }}
  ITS_TRAKT_SYNC_HISTORY: ${{ secrets.TRAKT_SYNC_HISTORY || 'false' }}
  ITS_TRAKT_SYNC_RATINGS: ${{ secrets.TRAKT_SYNC_RATINGS || 'true' }}
  ITS_TRAKT_SYNC_WATCHLIST: ${{ secrets.TRAKT_SYNC_WATCHLIST || 'true' }}
  ITS_TRAKT_SYNC_LISTS: ${{ secrets.TRAKT_SYNC_LISTS || 'true' }}
  ITS_TRAKT_SYNC_TIMEOUT: ${{ secrets.TRAKT_SYNC_TIMEOUT || '15m' }}

  ITS_TMDB_ENABLED: ${{ secrets.TMDB_ENABLED || 'false' }}
  ITS_TMDB_READACCESSTOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
  ITS_TMDB_SESSIONID: ${{ secrets.TMDB_SESSION_ID }}
  ITS_TMDB_SYNC_MODE: ${{ secrets.TMDB_SYNC_MODE || 'dry-run' }}
  ITS_TMDB_SYNC_HISTORY: ${{ secrets.TMDB_SYNC_HISTORY || 'false' }}
  ITS_TMDB_SYNC_RATINGS: ${{ secrets.TMDB_SYNC_RATINGS || 'true' }}
  ITS_TMDB_SYNC_WATCHLIST: ${{ secrets.TMDB_SYNC_WATCHLIST || 'false' }}
  ITS_TMDB_SYNC_LISTS: ${{ secrets.TMDB_SYNC_LISTS || 'false' }}
  ITS_TMDB_SYNC_TIMEOUT: ${{ secrets.TMDB_SYNC_TIMEOUT || '15m' }}

  ITS_STATE_DIR: ${{ github.workspace }}/runner/state
  ITS_STATE_RECONCILEINTERVAL: 168h

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out private runner state
        uses: actions/checkout@v5
        with:
          path: runner

      - name: Check out application source
        uses: actions/checkout@v5
        with:
          repository: scottia/IMDb-Trakt-TMDb-Sync
          ref: main
          path: app
          persist-credentials: false

      - name: Install Google Chrome
        run: |
          wget -q https://storage.googleapis.com/chromium-browser-snapshots/Linux_x64/1321438/chrome-linux.zip
          unzip -q chrome-linux.zip
          if test -f "$ITS_IMDB_BROWSERPATH"; then
            echo "Google Chrome binary stored at $ITS_IMDB_BROWSERPATH"
          else
            echo "Google Chrome binary not found at $ITS_IMDB_BROWSERPATH"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.1
          cache-dependency-path: app/go.sum

      - name: Build
        working-directory: app
        run: make build

      - name: Seed Trakt token
        env:
          TRAKT_TOKEN: ${{ secrets.TRAKT_TOKEN }}
        run: |
          if [ "$ITS_TRAKT_ENABLED" != "true" ]; then
            echo "Trakt destination disabled; skipping token seed"
            exit 0
          fi
          if [ -n "$TRAKT_TOKEN" ]; then
            printf '%s' "$TRAKT_TOKEN" > "$ITS_TRAKT_TOKENFILE"
          else
            echo "no TRAKT_TOKEN secret set; sync will print device authorization instructions, wait for manual auth and fail if unattended"
          fi

      - name: Sync
        working-directory: app
        run: make sync

      - name: Persist sync state
        if: success()
        working-directory: runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "sync state unchanged"
            exit 0
          fi
          git commit -m "chore(state): advance IMDb ratings baseline [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Persist rotated Trakt token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "$ITS_TRAKT_ENABLED" != "true" ]; then
            exit 0
          fi
          if [ ! -f "$ITS_TRAKT_TOKENFILE" ]; then
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "no GH_PAT secret set; cannot persist the rotated Trakt token"
            exit 1
          fi
          gh secret set TRAKT_TOKEN --repo "$GITHUB_REPOSITORY" < "$ITS_TRAKT_TOKENFILE"

  publish-status:
    name: publish runner status
    needs: sync
    if: always()
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.STATUS_PAT }}
      RUNNER_STATUS: ${{ needs.sync.result }}
      STATUS_REPOSITORY: scottia/IMDb-Trakt-TMDb-Sync
    steps:
      - name: Publish Runner status
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no STATUS_PAT secret set; skipping public Runner status"
            exit 0
          fi

          echo "Publishing Runner status: $RUNNER_STATUS"

          gh api \
            --method POST \
            "repos/$STATUS_REPOSITORY/dispatches" \
            -f event_type=runner_sync_status \
            -F "client_payload[status]=$RUNNER_STATUS"
