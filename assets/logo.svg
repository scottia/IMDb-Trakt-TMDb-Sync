<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">IMDb to Trakt and TMDb</title>
  <desc id="desc">IMDb flows to Trakt and TMDb</desc>
  <defs>
    <linearGradient id="trakt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1744"/>
      <stop offset="0.52" stop-color="#bd2aa4"/>
      <stop offset="1" stop-color="#8f45c5"/>
    </linearGradient>
    <linearGradient id="tmdb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#01c987"/>
      <stop offset="1" stop-color="#10d89a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="#fafafa"/>

  <!-- IMDb -->
  <rect x="70" y="70" width="235" height="220" rx="28" fill="#f5c518"/>
  <text x="187.5" y="212" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="900" fill="#000">IMDb</text>

  <!-- Direction -->
  <path d="M380 123 L437 180 L380 237" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M445 123 L502 180 L445 237" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Trakt -->
  <rect x="555" y="70" width="235" height="220" rx="44" fill="url(#trakt)"/>
  <path d="M606 117 H712" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="square"/>
  <path d="M606 117 C586 117 572 132 572 153 V228 C572 252 587 269 610 269 H736 C758 269 773 253 773 230 V198" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="square"/>
  <path d="M626 176 L653 203 L714 142" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M645 157 L672 184 L733 123" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="M665 138 L692 165 L753 104" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Separator -->
  <path d="M842 116 L814 244" stroke="#000" stroke-width="14" stroke-linecap="round"/>

  <!-- TMDb -->
  <rect x="885" y="70" width="245" height="220" rx="38" fill="url(#tmdb)"/>
  <circle cx="937" cy="139" r="24" fill="#fff"/>
  <circle cx="1007" cy="139" r="24" fill="#fff"/>
  <circle cx="1077" cy="139" r="24" fill="#fff"/>
  <text x="1007.5" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#fff">TMDB</text>
</svg>
