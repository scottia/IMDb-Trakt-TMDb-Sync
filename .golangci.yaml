version: "2"
linters:
  enable:
  - errcheck
  - govet
  - ineffassign
  - staticcheck
  - unused
  - misspell
  - revive
  - unconvert
  settings:
    revive:
      rules:
      - name: var-naming
        arguments:
        - [ "ID", "URL", "HTTP", "JSON", "API" ]
    errcheck:
      exclude-functions:
      - (*bytes.Buffer).ReadFrom
      - io.Copy
      - (io.ReadCloser).Close
      - (*github.com/go-rod/rod.HijackRouter).Stop
formatters:
  settings:
    gci:
      sections:
      - standard
      - default
      - prefix(github.com/scottia/IMDb-Trakt-TMDb-Sync)
      custom-order: true
